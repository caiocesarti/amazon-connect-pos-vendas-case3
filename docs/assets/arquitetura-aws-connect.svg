    EletroLar Varejo (Case 3) — Arquitetura Omnichannel de Pós-Venda na AWS
  </text>
  <text x="36" y="68" fill="#94A3B8" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Amazon Connect (Chat Online + Voz Camila Neural pt-BR) · Amazon Lex V2 · AWS Lambda Python 3.12 · Amazon DynamoDB · Amazon Q in Connect · CCP v2
  </text>

