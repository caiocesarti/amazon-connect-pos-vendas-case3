<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura AWS — EletroLar Varejo Pós-Venda Omnichannel (Case 3)</title>
  <desc id="desc">Diagrama de arquitetura AWS integrando Portal Web Vercel, Amazon Connect, Amazon Lex V2 (pt-BR Camila Neural), AWS Lambda Python 3.12, Amazon DynamoDB (PV-AssistenciasGarantia), Amazon Q in Connect (Wisdom + S3) e Agent Workspace CCP v2.</desc>

  <defs>
