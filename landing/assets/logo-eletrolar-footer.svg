<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 68" width="245" height="50" role="img" aria-label="EletroLar — Central de Pós-Venda e Suporte Técnico">
  <defs>
    <!-- Gradiente Principal do Emblema (Azul Royal -> Azul Marinho) -->
    <linearGradient id="brandShieldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Gradiente de Luz / Energia (Azul Celeste -> Ciano) -->
    <linearGradient id="brandCyanDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gradiente do Texto "Lar" no Modo Escuro / Rodapé -->
    <linearGradient id="textAccentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- ================= ÍCONE / EMBLEMA GEOMÉTRICO ================= -->
  <g transform="translate(4, 4)">
    <!-- Base Squircle Moderna -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#brandShieldDark)" />
    <!-- Borda Interna Sutil de Brilho -->
    <rect x="1" y="1" width="58" height="58" rx="15" fill="none" stroke="#93c5fd" stroke-opacity="0.45" stroke-width="1.2" />

    <!-- Arco de Proteção / Telhado "Lar" Estilizado -->
    <path d="M13 28 L30 13 L47 28" fill="none" stroke="url(#brandCyanDark)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Estrutura da Casa / Monograma -->
    <path d="M18 27 V43 C18 45.2 19.8 47 22 47 H38 C40.2 47 42 45.2 42 43 V27" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Símbolo Central de Energia / Check de Garantia -->
    <path d="M24.5 35.5 L28.5 39.5 L36.5 31" fill="none" stroke="#7dd3fc" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ponto Luminoso de Conectividade -->
    <circle cx="30" cy="22" r="2.4" fill="#bae6fd" />
  </g>

  <!-- ================= TIPOGRAFIA CORPORATIVA (FUNDO ESCURO) ================= -->
  <g transform="translate(78, 0)">
    <!-- Wordmark Principal: EletroLar -->
    <text x="0" y="37" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="800" letter-spacing="-0.9" fill="#ffffff">
      Eletro<tspan fill="url(#textAccentDark)">Lar</tspan>
    </text>

    <!-- Ponto de Destaque -->
    <circle cx="137" cy="32" r="3.2" fill="#38bdf8" />

    <!-- Subtítulo Institucional com Pill -->
    <rect x="1" y="45" width="76" height="16" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.8" />
    <text x="39" y="56" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.2" font-weight="700" letter-spacing="0.7" fill="#93c5fd">
      PÓS-VENDA
    </text>

    <text x="85" y="56" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#cbd5e1">
      SUPORTE OFICIAL
    </text>
  </g>
</svg>
